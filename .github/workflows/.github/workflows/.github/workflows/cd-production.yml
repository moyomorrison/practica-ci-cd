name: CD & Deployment Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue manual'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# Evita ejecuciones simultáneas del mismo grupo
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

# Permisos mínimos requeridos para OIDC y lectura
permissions:
  id-token: write
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      node-versions: '["20", "22"]'
      run-lint: true

  deploy-staging:
    name: Deploy to Staging
    needs: quality-gate
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: Descargar Artifact de compilación
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Desplegar en Staging
        run: |
          echo "Desplegando en Staging..."
          echo "¡Simulación de despliegue a Staging exitosa!"

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com

    steps:
      - name: Descargar Artifact de compilación
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Despliegue en Producción
        run: |
          echo "Ejecutando despliegue Zero-Downtime en Producción..."
          echo "¡Simulación de despliegue a Producción exitosa!"
